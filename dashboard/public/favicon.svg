<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #16171a; }
    .fg { fill: none; stroke: #f7f8f8; }
    .dot { fill: #f7f8f8; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f7f8f8; }
      .fg { stroke: #08090a; }
      .dot { fill: #08090a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <circle class="fg" cx="16" cy="16" r="7.5" stroke-width="2.5" />
  <circle class="dot" cx="16" cy="16" r="2.75" />
</svg>
