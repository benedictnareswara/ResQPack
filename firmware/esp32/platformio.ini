; WiFi credentials and device identity live in secrets.ini, which is gitignored.
; Copy secrets.ini.example to secrets.ini and fill it in before the first build.
; This repo is public — never put a real SSID or password in this file.
[platformio]
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	256dpi/MQTT @ ^2.5.2
build_flags =
	-DWIFI_SSID=\"${secrets.wifi_ssid}\"
	-DWIFI_PASSWORD=\"${secrets.wifi_password}\"
	-DMQTT_BROKER=\"broker.hivemq.com\"
	-DMQTT_PORT=1883
	-DMQTT_USERNAME=\"\"
	-DMQTT_PASSWORD=\"\"
	-DDEVICE_ID=\"${secrets.device_id}\"
